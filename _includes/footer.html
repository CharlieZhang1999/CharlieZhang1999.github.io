<footer class="footer">
  <div class="footer-inner">
    <ul class="icons">
      {% if site.github_username %}<li><a href="https://github.com/{{ site.github_username }}" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></li>{% endif %}
      {% if site.linkedin_username %}<li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>{% endif %}
      {% if site.feed_icon %}<li><a href="{{ site.github.url }}/{{ site.feed_icon }}.xml" aria-label="RSS feed"><i class="fa-solid fa-rss"></i></a></li>{% endif %}
    </ul>
    <p>&copy; {{ site.time | date: "%Y" }} Qiuyang Zhang</p>
  </div>
</footer>
