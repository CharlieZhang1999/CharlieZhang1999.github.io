<ul class="gallery" data-filter-list>
  {% for p in site.data.projects %}
  <li class="shot" data-tags="{{ p.tags | join: '|' }}">
    <button type="button" class="shot-btn" data-dialog="dlg-{{ p.slug }}{{ include.suffix }}" aria-haspopup="dialog">
      <span class="shot-frame">
        <img src="{{ p.image | prepend: site.github.url }}" width="{{ p.image_size[0] }}" height="{{ p.image_size[1] }}" alt="" loading="lazy" />
        <span class="shot-veil" aria-hidden="true"></span>
        <span class="shot-title">
          <strong>{{ p.name }}</strong>
          <span class="shot-rule" aria-hidden="true"></span>
          <span class="shot-stack">{{ p.stack }}</span>
        </span>
        <span class="shot-date">{{ p.dates }}</span>
      </span>
    </button>
    <dialog id="dlg-{{ p.slug }}{{ include.suffix }}" class="shot-dialog" aria-labelledby="dlg-{{ p.slug }}{{ include.suffix }}-t">
      <div class="dlg-inner">
        <div class="dlg-media"><img src="{{ p.image | prepend: site.github.url }}" width="{{ p.image_size[0] }}" height="{{ p.image_size[1] }}" alt="" loading="lazy" /><span class="shot-date">{{ p.dates }}</span></div>
        <div class="dlg-text">
          <form method="dialog"><button class="dlg-close" aria-label="Close">&times;</button></form>
          <p class="when">{{ p.role }}</p>
          <h3 id="dlg-{{ p.slug }}{{ include.suffix }}-t">{{ p.name }}</h3>
          <p class="lead">{{ p.summary }}</p>
          <ul class="bullets">{% for b in p.bullets %}<li>{{ b }}</li>{% endfor %}</ul>
          <ul class="chips" aria-label="Built with">{% for t in p.tags %}<li>{{ t }}</li>{% endfor %}</ul>
        </div>
      </div>
    </dialog>
  </li>
  {% endfor %}
</ul>
