# Week tabs on /flybrain/. One entry per week, in order. See flybrain/README.md.
#   week:    tab number
#   title:   one-line name of that week's result
#   dates:   shown under the tab
#   status:  done | in progress  (in progress shows a dot on the tab)
#   summary: one or two sentences above the demo
#   page:    folder under flybrain/ holding a self-contained index.html
- week: 1
  title: A fly brain that tastes words
  dates: Wrapped up 2026.10.24
  status: done
  summary: The Shiu et al. 2024 whole-brain model (127,400 neurons) rebuilt in plain NumPy and checked against the Brian2 reference. Pick a taste and watch the sugar → MN9 feeding circuit decide.
  page: week1
- week: 2
  title: Connectome Graph Explorer
  dates: Wrapped up 2026.11.03
  status: done
  summary: The model ported to the male brain (MaleCNS), 17 sensory words, a fix for the odor attractor, and a word readout. Explore every simulated trial on the wiring it used.
  page: week2
- week: 3
  title: The fly talks to an LLM
  dates: Wrapped up 2026.11.13
  status: done
  summary: The fly ↔ LLM loop, closed. Words play into the simulated fly and are decoded, Claude picks an action, and the action goes back into the same brain as a code on its hearing neurons, read off the descending neurons. Three rounds run in one continuous simulation (words 60/60, actions 12/12). Watch the video, play with the loop, type your own words, or read the full report.
  page: week3
