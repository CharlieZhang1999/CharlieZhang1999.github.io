- role: Software Development Engineer Intern
  org: Amazon
  dates: 2023.05 – 2023.08
  summary: On-device saliency and smart cropping for iOS images in Swift.
  bullets:
    - Applied Apple’s iOS Edge Saliency Model within the Vision framework, backed by the Neural Engine, to generate bounding boxes for salient regions and smart-crop images in Swift.
    - Assessed model performance on more than 1.5k images across diverse datasets, including selfies, food, and landscapes.
    - Built a visual prototype in Xcode showing the real-time effect of smart cropping, with side-by-side comparison against the baseline model.
    - Compared the iOS Edge Saliency Model, the baseline model, and Amazon’s in-house saliency model on latency and IoU, with suggestions for future improvements.
    - Shipped the beta build to TestFlight so the feature stayed available in later builds.
